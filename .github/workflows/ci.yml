name: MLOps CI

on:
  push:
    branches:
      - main
      - feature/devops-deployment

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Tests and code validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install CI tools
        run: pip install ruff

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            api \
            ingestion \
            orchestration \
            ml

      - name: Lint deployment code
        run: |
          ruff check \
            api \
            ingestion \
            orchestration \
            tests

      - name: Run API tests
        run: python -m pytest -q tests/test_api.py

      - name: Validate dbt project
        working-directory: transform
        run: dbt parse --profiles-dir .


  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t mlops-meia-v2:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: docker image inspect mlops-meia-v2:${{ github.sha }}